default: &default_network
  crypto_scheme_type: hybrid  # asymmetric+symmetric
  message_size_bytes: 0    # 8KiB
  work_size_bits:     22      # PoW(22b)
  fetch_timeout_ms:   60000   # 60s for response
  queue_period_ms:    5000    # 5s per message
networks:
  __testdata__:
    <<: *default_network
    work_size_bits: 20
    connections: 
      - tcp://1.1.1.1:9581