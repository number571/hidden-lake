version: "3"
services:
  recv_hls_service:
    build:
      context: ./../../../../
      dockerfile: examples/echo_service/_service/Dockerfile
    networks:
      - local-network
  recv_hls:
    build:
      context: ./../../../../
      dockerfile: cmd/hlh/hlh-composite/Dockerfile
    environment:
      - SERVICE_PATH=examples/echo_service/routing/hla_meshtastic/recv_hls
    devices:
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    networks:
      - local-network
      - hidden-lake
  send_hls:
    build:
      context: ./../../../../
      dockerfile: cmd/hlh/hlh-composite/Dockerfile
    environment:
      - SERVICE_PATH=examples/echo_service/routing/hla_meshtastic/send_hls
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    ports:
      - 7572:7572
    networks:
      - hidden-lake
networks:
  local-network:
    driver: bridge
  hidden-lake:
    driver: bridge
