version: "3"
services:
  node1_hlc:
    build:
      context: ./../../../
      dockerfile: cmd/hlh/hlh-composite/Dockerfile
    environment:
      - SERVICE_NETWORK=std-external-tcp
      - SERVICE_PATH=examples/filesharer/prod_test/node1_hlf
    ports:
      - 8541:8541
      - 8572:8572
  node2_hlc:
    build:
      context: ./../../../
      dockerfile: cmd/hlh/hlh-composite/Dockerfile
    environment:
      - SERVICE_NETWORK=std-external-tcp
      - SERVICE_PATH=examples/filesharer/prod_test/node2_hlf
    ports:
      - 7541:7541
