version: "3"
services:
  node1_hlc:
    build:
      context: ./../../../
      dockerfile: cmd/hlh/hlh-composite/Dockerfile
    environment:
      - SERVICE_NETWORK=std-external-tcp
      - SERVICE_PATH=examples/messenger/prod_test/node1_hlm
    ports:
      - 8080:8080
      - 8572:8572
  node2_hlc:
    build:
      context: ./../../../
      dockerfile: cmd/hlh/hlh-composite/Dockerfile
    environment:
      - SERVICE_NETWORK=std-external-tcp
      - SERVICE_PATH=examples/messenger/prod_test/node2_hlm
    ports:
      - 7070:7070
      - 7572:7572
